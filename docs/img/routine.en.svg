<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 262" role="img" aria-labelledby="t d" font-family="'Open Sans','Helvetica Neue',Arial,sans-serif"><title id="t">The first experiment routine</title><desc id="d">Four steps, from what confused you to an article someone else can repeat.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#232f3e"/></marker></defs><rect width="980" height="262" fill="#ffffff"/><rect x="20" y="30" width="205" height="112" fill="#ffffff" stroke="#879596" stroke-width="1.5"/><rect x="20" y="30" width="205" height="5" fill="#ec7211"/><text x="122.5" y="60" font-size="15" font-weight="700" fill="#16191f" text-anchor="middle">1. Real question</text><text x="122.5" y="82" font-size="13" font-weight="400" fill="#545b64" text-anchor="middle">What confused me?</text><text x="122.5" y="101" font-size="13" font-weight="400" fill="#545b64" text-anchor="middle">Who does it matter to?</text><text x="122" y="168" font-size="12" font-weight="600" fill="#0073bb" text-anchor="middle">PROPOSAL.md</text><line x1="225" y1="86" x2="258" y2="86" stroke="#232f3e" stroke-width="2" marker-end="url(#a)"/><rect x="260" y="30" width="205" height="112" fill="#ffffff" stroke="#879596" stroke-width="1.5"/><rect x="260" y="30" width="205" height="5" fill="#ec7211"/><text x="362.5" y="60" font-size="15" font-weight="700" fill="#16191f" text-anchor="middle">2. Small experiment</text><text x="362.5" y="82" font-size="13" font-weight="400" fill="#545b64" text-anchor="middle">Up to 2 hours</text><text x="362.5" y="101" font-size="13" font-weight="400" fill="#545b64" text-anchor="middle">Local, fictional data</text><text x="362" y="168" font-size="12" font-weight="600" fill="#0073bb" text-anchor="middle">PROPOSAL.md</text><line x1="465" y1="86" x2="498" y2="86" stroke="#232f3e" stroke-width="2" marker-end="url(#a)"/><rect x="500" y="30" width="205" height="112" fill="#ffffff" stroke="#879596" stroke-width="1.5"/><rect x="500" y="30" width="205" height="5" fill="#ec7211"/><text x="602.5" y="60" font-size="15" font-weight="700" fill="#16191f" text-anchor="middle">3. Evidence</text><text x="602.5" y="82" font-size="13" font-weight="400" fill="#545b64" text-anchor="middle">Expected vs. observed</text><text x="602.5" y="101" font-size="13" font-weight="400" fill="#545b64" text-anchor="middle">Including what failed</text><text x="602" y="168" font-size="12" font-weight="600" fill="#0073bb" text-anchor="middle">EVIDENCE.md</text><line x1="705" y1="86" x2="738" y2="86" stroke="#232f3e" stroke-width="2" marker-end="url(#a)"/><rect x="740" y="30" width="205" height="112" fill="#f1faff" stroke="#879596" stroke-width="1.5"/><rect x="740" y="30" width="205" height="5" fill="#ec7211"/><text x="842.5" y="60" font-size="15" font-weight="700" fill="#16191f" text-anchor="middle">4. Article</text><text x="842.5" y="82" font-size="13" font-weight="400" fill="#545b64" text-anchor="middle">Written by you</text><text x="842.5" y="101" font-size="13" font-weight="400" fill="#545b64" text-anchor="middle">AI only reviews</text><text x="842" y="168" font-size="12" font-weight="600" fill="#0073bb" text-anchor="middle">ARTICLE.md + CHECKLIST.md</text><path d="M 842 182 C 842 222, 122 222, 122 186" fill="none" stroke="#879596" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#a)"/><text x="480" y="246" font-size="13" font-weight="400" fill="#545b64" text-anchor="middle">A refuted hypothesis is a result too: go back to the question with what you learned.</text></svg>
