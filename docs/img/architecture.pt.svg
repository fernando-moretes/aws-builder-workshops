<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 975 436" role="img" aria-labelledby="t d" font-family="'Open Sans','Helvetica Neue',Arial,sans-serif"><title id="t">Arquitetura do kit</title><desc id="d">Um motor sem rede atende CLI, servidor MCP e console no navegador. O lab Python é a referência, garantida por teste de paridade.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#232f3e"/></marker></defs><rect width="975" height="436" fill="#ffffff"/><text x="20" y="26" font-size="13" font-weight="700" fill="#545b64" text-anchor="start">Quem usa</text><rect x="20" y="38" width="215" height="80" fill="#f2f3f3" stroke="#879596" stroke-width="1.5"/><text x="127.5" y="68" font-size="15" font-weight="700" fill="#16191f" text-anchor="middle">Pessoa no terminal</text><text x="127.5" y="90" font-size="13" font-weight="400" fill="#545b64" text-anchor="middle">npx, Docker</text><line x1="127" y1="118" x2="127" y2="150" stroke="#232f3e" stroke-width="2" marker-end="url(#a)"/><rect x="20" y="152" width="215" height="50" fill="#ffffff" stroke="#879596" stroke-width="1.5"/><rect x="20" y="152" width="215" height="5" fill="#ec7211"/><text x="127.5" y="182" font-size="15" font-weight="700" fill="#16191f" text-anchor="middle">CLI</text><rect x="260" y="38" width="215" height="80" fill="#f2f3f3" stroke="#879596" stroke-width="1.5"/><text x="367.5" y="68" font-size="15" font-weight="700" fill="#16191f" text-anchor="middle">Agente ou IDE</text><text x="367.5" y="90" font-size="13" font-weight="400" fill="#545b64" text-anchor="middle">Kiro, Claude Code,</text><text x="367.5" y="109" font-size="13" font-weight="400" fill="#545b64" text-anchor="middle">Cursor, VS Code</text><line x1="367" y1="118" x2="367" y2="150" stroke="#232f3e" stroke-width="2" marker-end="url(#a)"/><rect x="260" y="152" width="215" height="50" fill="#ffffff" stroke="#879596" stroke-width="1.5"/><rect x="260" y="152" width="215" height="5" fill="#ec7211"/><text x="367.5" y="182" font-size="15" font-weight="700" fill="#16191f" text-anchor="middle">Servidor MCP (stdio)</text><rect x="500" y="38" width="215" height="80" fill="#f2f3f3" stroke="#879596" stroke-width="1.5"/><text x="607.5" y="68" font-size="15" font-weight="700" fill="#16191f" text-anchor="middle">Pessoa no navegador</text><text x="607.5" y="90" font-size="13" font-weight="400" fill="#545b64" text-anchor="middle">Site e Hugging Face</text><line x1="607" y1="118" x2="607" y2="150" stroke="#232f3e" stroke-width="2" marker-end="url(#a)"/><rect x="500" y="152" width="215" height="50" fill="#ffffff" stroke="#879596" stroke-width="1.5"/><rect x="500" y="152" width="215" height="5" fill="#ec7211"/><text x="607.5" y="182" font-size="15" font-weight="700" fill="#16191f" text-anchor="middle">Console estático</text><rect x="740" y="38" width="215" height="80" fill="#f2f3f3" stroke="#879596" stroke-width="1.5"/><text x="847.5" y="68" font-size="15" font-weight="700" fill="#16191f" text-anchor="middle">Agente Python</text><text x="847.5" y="90" font-size="13" font-weight="400" fill="#545b64" text-anchor="middle">Strands + Bedrock</text><text x="847.5" y="109" font-size="13" font-weight="400" fill="#545b64" text-anchor="middle">opcional, opt-in</text><line x1="847" y1="118" x2="847" y2="150" stroke="#232f3e" stroke-width="2" marker-end="url(#a)"/><rect x="740" y="152" width="215" height="50" fill="#f1faff" stroke="#879596" stroke-width="1.5"/><rect x="740" y="152" width="215" height="5" fill="#ec7211"/><text x="847.5" y="182" font-size="15" font-weight="700" fill="#16191f" text-anchor="middle">labs/triage-agent</text><line x1="127" y1="202" x2="127" y2="246" stroke="#232f3e" stroke-width="2" marker-end="url(#a)"/><line x1="367" y1="202" x2="367" y2="246" stroke="#232f3e" stroke-width="2" marker-end="url(#a)"/><line x1="607" y1="202" x2="607" y2="246" stroke="#232f3e" stroke-width="2" marker-end="url(#a)"/><rect x="20" y="248" width="695" height="72" fill="#232f3e"/><text x="367" y="278" font-size="16" font-weight="700" fill="#fff" text-anchor="middle">Motor do lab (core.mjs)</text><text x="367" y="302" font-size="13" font-weight="400" fill="#d5dbdb" text-anchor="middle">Evidência sintética, só leitura. Sem rede, sem credencial, zero mutação.</text><rect x="740" y="248" width="215" height="72" fill="#f1faff" stroke="#879596" stroke-width="1.5"/><text x="847.5" y="289" font-size="15" font-weight="700" fill="#16191f" text-anchor="middle">core.py</text><line x1="847" y1="202" x2="847" y2="246" stroke="#232f3e" stroke-width="2" marker-end="url(#a)"/><line x1="715" y1="284" x2="738" y2="284" stroke="#232f3e" stroke-width="2" marker-end="url(#a)"/><text x="727" y="342" font-size="12" font-weight="600" fill="#0073bb" text-anchor="middle">Teste de paridade</text><rect x="20" y="360" width="935" height="62" fill="#f2f3f3" stroke="#879596" stroke-width="1.5"/><text x="487.5" y="390" font-size="15" font-weight="700" fill="#16191f" text-anchor="middle">Conteúdo</text><text x="487.5" y="412" font-size="13" font-weight="400" fill="#545b64" text-anchor="middle">Caderno, guia do facilitador, modelos, skill e avaliação real</text></svg>
