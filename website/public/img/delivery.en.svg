<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 830 320" role="img" aria-labelledby="t d" font-family="'Open Sans','Helvetica Neue',Arial,sans-serif"><title id="t">How the project ships</title><desc id="d">Every pull request runs Node and Python tests, Docker and the site build. A merge publishes the docs, and a tag publishes the packages.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#232f3e"/></marker></defs><rect width="830" height="320" fill="#ffffff"/><rect x="20" y="30" width="170" height="92" fill="#ffffff" stroke="#879596" stroke-width="1.5"/><rect x="20" y="30" width="170" height="5" fill="#232f3e"/><text x="105" y="60" font-size="15" font-weight="700" fill="#16191f" text-anchor="middle">Pull request</text><text x="105" y="82" font-size="13" font-weight="400" fill="#545b64" text-anchor="middle">review</text><line x1="190" y1="76" x2="218" y2="76" stroke="#232f3e" stroke-width="2" marker-end="url(#a)"/><rect x="220" y="30" width="170" height="92" fill="#ffffff" stroke="#879596" stroke-width="1.5"/><rect x="220" y="30" width="170" height="5" fill="#232f3e"/><text x="305" y="60" font-size="15" font-weight="700" fill="#16191f" text-anchor="middle">CI</text><text x="305" y="82" font-size="13" font-weight="400" fill="#545b64" text-anchor="middle">Node 20, 22, 24</text><text x="305" y="101" font-size="13" font-weight="400" fill="#545b64" text-anchor="middle">Python, Docker, site</text><line x1="390" y1="76" x2="418" y2="76" stroke="#232f3e" stroke-width="2" marker-end="url(#a)"/><rect x="420" y="30" width="170" height="92" fill="#ffffff" stroke="#879596" stroke-width="1.5"/><rect x="420" y="30" width="170" height="5" fill="#232f3e"/><text x="505" y="60" font-size="15" font-weight="700" fill="#16191f" text-anchor="middle">main</text><text x="505" y="82" font-size="13" font-weight="400" fill="#545b64" text-anchor="middle">merge</text><line x1="590" y1="76" x2="618" y2="76" stroke="#232f3e" stroke-width="2" marker-end="url(#a)"/><rect x="620" y="30" width="170" height="92" fill="#ffffff" stroke="#879596" stroke-width="1.5"/><rect x="620" y="30" width="170" height="5" fill="#ec7211"/><text x="705" y="60" font-size="15" font-weight="700" fill="#16191f" text-anchor="middle">Tag vX.Y.Z</text><text x="705" y="82" font-size="13" font-weight="400" fill="#545b64" text-anchor="middle">version in</text><text x="705" y="101" font-size="13" font-weight="400" fill="#545b64" text-anchor="middle">package.json</text><line x1="530" y1="122" x2="530" y2="170" stroke="#232f3e" stroke-width="2" marker-end="url(#a)"/><rect x="435" y="172" width="190" height="46" fill="#f1faff" stroke="#879596" stroke-width="1.5"/><text x="530" y="200" font-size="15" font-weight="700" fill="#16191f" text-anchor="middle">GitHub Pages</text><rect x="655" y="144" width="150" height="36" fill="#f2f3f3" stroke="#879596" stroke-width="1.5"/><text x="730" y="167" font-size="15" font-weight="700" fill="#16191f" text-anchor="middle">npm (OIDC)</text><rect x="655" y="186" width="150" height="36" fill="#f2f3f3" stroke="#879596" stroke-width="1.5"/><text x="730" y="209" font-size="15" font-weight="700" fill="#16191f" text-anchor="middle">Images on GHCR</text><rect x="655" y="228" width="150" height="36" fill="#f2f3f3" stroke="#879596" stroke-width="1.5"/><text x="730" y="251" font-size="15" font-weight="700" fill="#16191f" text-anchor="middle">GitHub Release</text><rect x="655" y="270" width="150" height="36" fill="#f2f3f3" stroke="#879596" stroke-width="1.5"/><text x="730" y="293" font-size="15" font-weight="700" fill="#16191f" text-anchor="middle">Hugging Face</text><line x1="705" y1="122" x2="705" y2="142" stroke="#232f3e" stroke-width="2" marker-end="url(#a)"/></svg>
