<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 366" role="img" aria-labelledby="t d" font-family="'Open Sans','Helvetica Neue',Arial,sans-serif"><title id="t">Agent trust boundary</title><desc id="d">The agent only gets two read-only tools. Text from tools is data, never instructions. A person decides on changes.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#232f3e"/></marker></defs><rect width="800" height="366" fill="#ffffff"/><rect x="20" y="110" width="150" height="70" fill="#f2f3f3" stroke="#879596" stroke-width="1.5"/><text x="95" y="150" font-size="15" font-weight="700" fill="#16191f" text-anchor="middle">Person's request</text><line x1="170" y1="145" x2="218" y2="145" stroke="#232f3e" stroke-width="2" marker-end="url(#a)"/><rect x="220" y="95" width="190" height="100" fill="#ffffff" stroke="#879596" stroke-width="1.5"/><rect x="220" y="95" width="190" height="5" fill="#ec7211"/><text x="315" y="125" font-size="15" font-weight="700" fill="#16191f" text-anchor="middle">Agent</text><text x="315" y="147" font-size="13" font-weight="400" fill="#545b64" text-anchor="middle">Model + instructions</text><text x="315" y="166" font-size="13" font-weight="400" fill="#545b64" text-anchor="middle">At most 4 calls</text><rect x="450" y="20" width="330" height="205" fill="#f2f8f0" stroke="#1d8102" stroke-dasharray="6 5"/><text x="615" y="42" font-size="12" font-weight="700" fill="#1d8102" text-anchor="middle">read-only</text><rect x="465" y="52" width="195" height="70" fill="#ffffff" stroke="#879596" stroke-width="1.5"/><text x="562.5" y="82" font-size="15" font-weight="700" fill="#16191f" text-anchor="middle">consultar_status</text><text x="562.5" y="104" font-size="13" font-weight="400" fill="#545b64" text-anchor="middle">api, fila, liquidacao</text><rect x="465" y="136" width="195" height="74" fill="#ffffff" stroke="#879596" stroke-width="1.5"/><text x="562.5" y="166" font-size="15" font-weight="700" fill="#16191f" text-anchor="middle">consultar_runbook</text><text x="562.5" y="188" font-size="13" font-weight="400" fill="#545b64" text-anchor="middle">INC-001, untrusted</text><line x1="410" y1="125" x2="463" y2="90" stroke="#232f3e" stroke-width="2" marker-end="url(#a)"/><line x1="410" y1="165" x2="463" y2="170" stroke="#232f3e" stroke-width="2" marker-end="url(#a)"/><rect x="680" y="90" width="88" height="84" fill="#ffffff" stroke="#879596" stroke-width="1.5"/><text x="724" y="120" font-size="15" font-weight="700" fill="#16191f" text-anchor="middle">Fictional</text><text x="724" y="142" font-size="13" font-weight="400" fill="#545b64" text-anchor="middle">data</text><line x1="660" y1="90" x2="678" y2="110" stroke="#232f3e" stroke-width="2" marker-end="url(#a)"/><line x1="660" y1="170" x2="678" y2="150" stroke="#232f3e" stroke-width="2" marker-end="url(#a)"/><rect x="220" y="250" width="190" height="96" fill="#ffffff" stroke="#879596" stroke-width="1.5"/><text x="315" y="280" font-size="15" font-weight="700" fill="#16191f" text-anchor="middle">Answer with sources</text><text x="315" y="302" font-size="13" font-weight="400" fill="#545b64" text-anchor="middle">Observation, hypothesis,</text><text x="315" y="321" font-size="13" font-weight="400" fill="#545b64" text-anchor="middle">gap, next step</text><line x1="315" y1="195" x2="315" y2="248" stroke="#232f3e" stroke-width="2" marker-end="url(#a)"/><rect x="20" y="262" width="150" height="74" fill="#f1faff" stroke="#879596" stroke-width="1.5"/><rect x="20" y="262" width="150" height="5" fill="#0073bb"/><text x="95" y="292" font-size="15" font-weight="700" fill="#0073bb" text-anchor="middle">Human review</text><text x="95" y="314" font-size="13" font-weight="400" fill="#545b64" text-anchor="middle">review_required: true</text><line x1="220" y1="298" x2="172" y2="298" stroke="#232f3e" stroke-width="2" marker-end="url(#a)"/><rect x="450" y="250" width="330" height="96" fill="#fdf3f1" stroke="#d13212"/><text x="615" y="280" font-size="15" font-weight="700" fill="#d13212" text-anchor="middle">Does not exist</text><text x="615" y="304" font-size="13" font-weight="400" fill="#545b64" text-anchor="middle">shell, SQL, arbitrary HTTP</text><text x="615" y="324" font-size="13" font-weight="400" fill="#545b64" text-anchor="middle">any tool that changes things</text><line x1="400" y1="195" x2="470" y2="248" stroke="#d13212" stroke-width="2" stroke-dasharray="4 5"/><text x="428" y="236" font-size="11" font-weight="400" fill="#d13212" text-anchor="end">no path</text></svg>
