name: Triage lab

on:
  pull_request:
    paths:
      - 'labs/triage-agent/**'
      - '.github/workflows/triage-lab.yml'
  push:
    branches: [main]
    paths:
      - 'labs/triage-agent/**'
      - '.github/workflows/triage-lab.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      AWS_EC2_METADATA_DISABLED: 'true'
      TRIAGE_ENABLE_BEDROCK: '0'
    defaults:
      run:
        working-directory: labs/triage-agent
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: labs/triage-agent/requirements.txt
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
