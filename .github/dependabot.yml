version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
    groups: { actions: { patterns: ['*'] } }
  - package-ecosystem: npm
    directory: /
    schedule: { interval: monthly }
    groups: { npm: { patterns: ['*'] } }
  - package-ecosystem: npm
    directory: /website
    schedule: { interval: monthly }
    groups: { site: { patterns: ['*'] } }
  - package-ecosystem: pip
    directory: /labs/triage-agent
    schedule: { interval: monthly }
  - package-ecosystem: docker
    directories: ['/', '/labs/triage-agent']
    schedule: { interval: monthly }
    # Versões ímpares do Node não têm LTS e duram poucos meses.
    ignore:
      - dependency-name: node
        versions: ['>=25 <26', '>=27 <28', '>=29 <30']
